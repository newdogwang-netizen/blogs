title: "newdogwang's blog"
tagline: "技术、系统与研究笔记"
description: "记录技术实践、系统原理、AI 基础设施与持续研究的个人博客。"
url: "https://newdogwang-netizen.github.io"
baseurl: "/blogs"
lang: "zh-CN"
timezone: "Asia/Shanghai"

author:
  name: "newdogwang-netizen"
  url: "https://github.com/newdogwang-netizen"

repository: "newdogwang-netizen/blogs"
github_username: "newdogwang-netizen"

markdown: kramdown
highlighter: rouge
permalink: "/:categories/:title/"
future: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "newdogwang-netizen"

exclude:
  - work
  - outputs
  - README.md
