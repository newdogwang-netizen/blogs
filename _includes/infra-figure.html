<figure class="architecture-figure infra-figure">
  <a href="{{ '/assets/images/cloud-native/' | append: include.file | append: '.svg' | relative_url }}" target="_blank" rel="noopener" aria-label="{{ include.alt | escape }}，打开原图">
    <img src="{{ '/assets/images/cloud-native/' | append: include.file | append: '.svg' | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">
  </a>
  <figcaption>{{ include.caption }} <span>小屏可横向滑动，点击查看原图。</span></figcaption>
</figure>
