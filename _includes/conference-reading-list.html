<ol class="topic-reading-list">
  {% for post in include.notes %}
  <li>
    {% assign note_number = post.series_part | default: forloop.index %}
    <span class="topic-number">{% if note_number < 10 %}0{% endif %}{{ note_number }}</span>
    <div>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      <p>{{ post.description }}</p>
      <span class="topic-time">{{ post.reading_time }} · 机制图与验证思路</span>
    </div>
  </li>
  {% endfor %}
</ol>
