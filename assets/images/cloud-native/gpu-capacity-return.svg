<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">借出 GPU 之后，怎样按时交还？</title><desc id="desc">逻辑顺序示意；总预算应按真实依赖的关键路径计算</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">借出 GPU 之后，怎样按时交还？</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">逻辑顺序示意；总预算应按真实依赖的关键路径计算</text><rect x="55" y="130" width="300" height="105" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="73" y="164" font-size="24" fill="#25352f" text-anchor="start">检测需求回升</text><text x="73" y="195" font-size="20" fill="#5c6d64" text-anchor="start">阈值 / 预测 / 人工意图</text><rect x="395" y="130" width="300" height="105" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="413" y="164" font-size="24" fill="#25352f" text-anchor="start">停止接收新离线工作</text><text x="413" y="195" font-size="20" fill="#5c6d64" text-anchor="start">避免边回收边继续准入</text><rect x="735" y="130" width="290" height="105" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="753" y="164" font-size="24" fill="#25352f" text-anchor="start">保存可恢复状态</text><text x="753" y="195" font-size="20" fill="#5c6d64" text-anchor="start">checkpoint / 排空</text><polyline points="355,182 392,182" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="695,182 732,182" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="881,235 881,293 880,332" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="335" width="290" height="105" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="753" y="369" font-size="24" fill="#25352f" text-anchor="start">释放设备与归属</text><text x="753" y="400" font-size="20" fill="#5c6d64" text-anchor="start">确认不再被旧作业使用</text><rect x="395" y="335" width="300" height="105" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="413" y="369" font-size="24" fill="#25352f" text-anchor="start">加载在线副本</text><text x="413" y="400" font-size="20" fill="#5c6d64" text-anchor="start">权重 / 引擎 / 缓存预热</text><rect x="55" y="335" width="300" height="105" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="73" y="369" font-size="24" fill="#25352f" text-anchor="start">验证可服务容量</text><text x="73" y="400" font-size="20" fill="#5c6d64" text-anchor="start">路由随后才接入流量</text><polyline points="735,387 698,387" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="395,387 358,387" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="492" width="970" height="70" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="73" y="526" font-size="24" fill="#25352f" text-anchor="start">需求上涨速度 &gt; 归还速度时：需要热余量、提前量或更少借出</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
