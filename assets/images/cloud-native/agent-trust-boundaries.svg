<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">执行、网络、身份：三条边界</title><desc id="desc">示意架构：VM 隔离不等于业务授权，授权也不等于执行隔离</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">执行、网络、身份：三条边界</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">示意架构：VM 隔离不等于业务授权，授权也不等于执行隔离</text><rect x="50" y="120" width="255" height="95" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="68" y="154" font-size="24" fill="#25352f" text-anchor="start">用户 / 任务授权</text><text x="68" y="185" font-size="20" fill="#5c6d64" text-anchor="start">目标、动作、期限</text><rect x="395" y="120" width="290" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="413" y="154" font-size="24" fill="#25352f" text-anchor="start">任务控制器</text><text x="413" y="185" font-size="20" fill="#5c6d64" text-anchor="start">任务身份 / 环境申请</text><rect x="780" y="120" width="245" height="95" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="798" y="154" font-size="24" fill="#25352f" text-anchor="start">模型服务</text><text x="798" y="185" font-size="20" fill="#5c6d64" text-anchor="start">建议动作与代码</text><polyline points="305,167 392,167" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="780,167 688,167" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="360" y="268" width="375" height="285" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="378" y="297" font-size="20" fill="#5c6d64" text-anchor="start">执行边界 / 沙箱</text><rect x="395" y="325" width="305" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="413" y="359" font-size="24" fill="#25352f" text-anchor="start">生成代码 / 第三方依赖</text><text x="413" y="390" font-size="20" fill="#5c6d64" text-anchor="start">Kata 等运行时隔离</text><rect x="395" y="446" width="305" height="70" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="413" y="480" font-size="24" fill="#25352f" text-anchor="start">受限文件与出网策略</text><polyline points="540,215 540,322" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="325" width="255" height="95" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="68" y="359" font-size="24" fill="#25352f" text-anchor="start">短期凭证 / 授权服务</text><text x="68" y="390" font-size="20" fill="#5c6d64" text-anchor="start">与任务生命周期绑定</text><polyline points="177,420 177,492 392,492" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="780" y="325" width="245" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="798" y="359" font-size="24" fill="#25352f" text-anchor="start">工具网关</text><text x="798" y="390" font-size="20" fill="#5c6d64" text-anchor="start">资源级、动作级检查</text><rect x="780" y="466" width="245" height="88" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="798" y="500" font-size="24" fill="#25352f" text-anchor="start">外部系统</text><text x="798" y="531" font-size="20" fill="#5c6d64" text-anchor="start">可审计的真实副作用</text><polyline points="700,371 777,371" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="901,420 901,463" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
