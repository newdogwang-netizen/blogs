<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">主机交付有三类不同的网络职责</title><desc id="desc">蓝色：控制路径；绿色：制品数据；不要求三套独立物理交换机</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">主机交付有三类不同的网络职责</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">蓝色：控制路径；绿色：制品数据；不要求三套独立物理交换机</text><rect x="45" y="130" width="260" height="95" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="63" y="164" font-size="24" fill="#25352f" text-anchor="start">主机声明 / BMO</text><text x="63" y="195" font-size="20" fill="#5c6d64" text-anchor="start">Kubernetes 期望状态</text><rect x="410" y="130" width="260" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="428" y="164" font-size="24" fill="#25352f" text-anchor="start">Ironic</text><text x="428" y="195" font-size="20" fill="#5c6d64" text-anchor="start">任务状态 / 硬件驱动</text><rect x="775" y="130" width="260" height="95" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="793" y="164" font-size="24" fill="#25352f" text-anchor="start">BMC</text><text x="793" y="195" font-size="20" fill="#5c6d64" text-anchor="start">电源 / 启动控制</text><polyline points="305,176 407,176" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="670,176 772,176" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="682" y="159" font-size="19" fill="#5c6d64" text-anchor