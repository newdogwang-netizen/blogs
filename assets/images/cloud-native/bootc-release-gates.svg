<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">OCI 制品到 GPU 节点，中间有多道发布门禁</title><desc id="desc">版本回退只覆盖相应系统部署，不自动恢复业务数据或固件</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">OCI 制品到 GPU 节点，中间有多道发布门禁</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">版本回退只覆盖相应系统部署，不自动恢复业务数据或固件</text><rect x="45" y="125" width="275" height="110" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="63" y="159" font-size="24" fill="#25352f" text-anchor="start">构建 OS 制品</text><text x="63" y="190" font-size="20" fill="#5c6d64" text-anchor="start">镜像内容 / provenance</text><text x="63" y="217" font-size="20" fill="#5c6d64" text-anchor="start">固定 digest</text><rect x="400" y="125" width="275" height="110" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="418" y="159" font-size="24" fill="#25352f" text-anchor="start">测试机安装</text><text x="418" y="190" font-size="20" fill="#5c6d64" text-anchor="start">磁盘选择与覆盖审批</text><text x="418" y="217" font-size="20" fill="#5c6d64" text-anchor="start">记录硬件组合</text><rect x="755" y="125" width="275" height="110" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="773" y="159" font-size="24" fill="#25352f" text-anchor="start">系统与设备验收</text><text x="773" y="190" font-size="20" fill="#5c6d64" text-anchor="start">启动 / GPU / NIC</text><text x="773" y="217" font-size="20" fill="#5c6d64" text-anchor="start">代表性工作负载</text><polyline points="320,180 397,180" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="675,180 752,180" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="894,235 894,342" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="755" y="345" width="275" height="110" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="773" y="379" font-size="24" fill="#25352f" text-anchor="start">灰度发布</text><text x="773" y="410" font-size="20" fill="#5c6d64" text-anchor="start">先少量，再扩大</text><text x="773" y="437" font-size="20" fill="#5c6d64" text-anchor="start">记录实际启动版本</text><rect x="400" y="345" width="275" height="110" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="418" y="379" font-size="24" fill="#25352f" text-anchor="start">观察与放行</text><text x="418" y="410" font-size="20" fill="#5c6d64" text-anchor="start">服务质量 / 恢复能力</text><text x="418" y="437" font-size="20" fill="#5c6d64" text-anchor="start">不是只检查 SSH</text><rect x="45" y="345" width="275" height="110" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="63" y="379" font-size="24" fill="#25352f" text-anchor="start">扩大交付范围</text><text x="63" y="410" font-size="20" fill="#5c6d64" text-anchor="start">保留旧制品与恢复路径</text><polyline points="755,400 678,400" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="400,400 323,400" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="507" width="985" height="60" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="63" y="541" font-size="24" fill="#25352f" text-anchor="start">门禁失败：停止扩大范围 → 识别阶段 → 受控修复或回退</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
