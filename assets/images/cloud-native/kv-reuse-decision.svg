<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">外部 KV 命中之后，仍要判断能否复用、是否划算</title><desc id="desc">作者分析模型；具体引擎可能不提供全部动态选择能力</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">外部 KV 命中之后，仍要判断能否复用、是否划算</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">作者分析模型；具体引擎可能不提供全部动态选择能力</text><rect x="50" y="125" width="300" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="68" y="159" font-size="24" fill="#25352f" text-anchor="start">匹配 / 兼容 / 授权</text><text x="68" y="190" font-size="20" fill="#5c6d64" text-anchor="start">前缀、版本、布局与租户</text><rect x="430" y="125" width="600" height="100" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="448" y="159" font-size="24" fill="#25352f" text-anchor="start">不满足 → 不复用</text><text x="448" y="190" font-size="20" fill="#5c6d64" text-anchor="start">缓存存在不能覆盖正确性与安全边界</text><polyline points="350,176 427,176" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="160" font-size="19" fill="#5c6d64" text-anchor="start">否</text><polyline points="200,225 200,317" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="216" y="276" font-size="19" fill="#5c6d64" text-anchor="start">是</text><rect x="50" y="320" width="300" height="120" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="68" y="354" font-size="24" fill="#25352f" text-anchor="start">比较关键路径成本</text><text x="68" y="385" font-size="20" fill="#5c6d64" text-anchor="start">Tcache 与 Tcompute</text><text x="68" y="412" font-size="20" fill="#5c6d64" text-anchor="start">计入排队、转换与同步</text><rect x="430" y="290" width="600" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="448" y="324" font-size="24" fill="#25352f" text-anchor="start">Tcache &lt; Tcompute：候选复用</text><text x="448" y="355" font-size="20" fill="#5c6d64" text-anchor="start">读取、校验、完成同步之后消费</text><rect x="430" y="440" width="600" height="100" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="448" y="474" font-size="24" fill="#25352f" text-anchor="start">否则：重算可能更便宜</text><text x="448" y="505" font-size="20" fill="#5c6d64" text-anchor="start">应把存储拥塞与可重叠阶段纳入判断</text><polyline points="350,357 390,357 390,340 427,340" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,411 390,411 390,490 427,490" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
