<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">缓存命中、加载完成、保存完成：三个事件</title><desc id="desc">以常规 vLLM 外部前缀复用路径为例；特殊布局需要独立检查</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#49439C"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D6B33"/></marker></defs><rect width="1080" height="630" fill="#F4F4F8"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#1E1C32" text-anchor="start">缓存命中、加载完成、保存完成：三个事件</text><text x="36" y="78" font-size="19" fill="#68677A" text-anchor="start">以常规 vLLM 外部前缀复用路径为例；特殊布局需要独立检查</text><rect x="45" y="130" width="275" height="100" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="63" y="164" font-size="24" fill="#1E1C32" text-anchor="start">调度侧 Connector</text><text x="63" y="195" font-size="20" fill="#68677A" text-anchor="start">查询外部连续命中块</text><rect x="400" y="130" width="275" height="100" rx="12" fill="#E4E4F7" stroke="#9190A4" stroke-width="1.5"/><text x="418" y="164" font-size="24" fill="#1E1C32" text-anchor="start">引擎分配目标块</text><text x="418" y="195" font-size="20" fill="#68677A" text-anchor="start">规划重算与复用范围</text><rect x="755" y="130" width="275" height="100" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="773" y="164" font-size="24" fill="#1E1C32" text-anchor="start">Worker / Connector</text><text x="773" y="195" font-size="20" fill="#68677A" text-anchor="start">建立布局与传输映射</text><polyline points="320,181 397,181" fill="none" stroke="#49439C" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="675,181 752,181" fill="none" stroke="#49439C" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="894,230 894,327" fill="none" stroke="#49439C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="755" y="330" width="275" height="100" rx="12" fill="#E4E4F7" stroke="#9190A4" stroke-width="1.5"/><text x="773" y="364" font-size="24" fill="#1E1C32" text-anchor="start">Store → 设备缓冲</text><text x="773" y="395" font-size="20" fill="#68677A" text-anchor="start">等待 load 完成</text><rect x="400" y="330" width="275" height="100" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="418" y="364" font-size="24" fill="#1E1C32" text-anchor="start">Attention / 补算</text><text x="418" y="395" font-size="20" fill="#68677A" text-anchor="start">数据就绪后才消费</text><rect x="45" y="330" width="275" height="100" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="63" y="364" font-size="24" fill="#1E1C32" text-anchor="start">完整块提交保存</text><text x="63" y="395" font-size="20" fill="#68677A" text-anchor="start">save 完成另行确认</text><polyline points="755,382 678,382" fill="none" stroke="#4D6B33" stroke-width="2.5" marker-end="url(#data)"/><text x="681" y="364" font-size="19" fill="#68677A" text-anchor="start">数据就绪</text><polyline points="400,382 323,382" fill="none" stroke="#49439C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="488" width="985" height="80" rx="12" fill="#FFFFFF" stroke="#9190A4" stroke-width="1.5"/><text x="63" y="522" font-size="24" fill="#1E1C32" text-anchor="start">lookup 后仍可能缺块或传输失败</text><text x="63" y="553" font-size="20" fill="#68677A" text-anchor="start">缓存回退必须由引擎集成正确处理，命中计数不等于实际跳过的计算</text><text x="36" y="606" font-size="17" fill="#68677A" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
