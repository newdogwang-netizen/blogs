<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">容量意图，怎样变成真正能路由的服务？</title><desc id="desc">示意为多控制环协作，不是任一产品的默认原子事务</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">容量意图，怎样变成真正能路由的服务？</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">示意为多控制环协作，不是任一产品的默认原子事务</text><rect x="45" y="130" width="275" height="100" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="63" y="164" font-size="24" fill="#25352f" text-anchor="start">推理需求上升</text><text x="63" y="195" font-size="20" fill="#5c6d64" text-anchor="start">SLO / 排队 / token 负载</text><rect x="400" y="130" width="275" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="418" y="164" font-size="24" fill="#25352f" text-anchor="start">提交容量意图</text><text x="418" y="195" font-size="20" fill="#5c6d64" text-anchor="start">目标副本的唯一写入者</text><rect x="755" y="130" width="275" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="773" y="164" font-size="24" fill="#25352f" text-anchor="start">预算与本地准入</text><text x="773" y="195" font-size="20" fill="#5c6d64" text-anchor="start">配额 / 组条件 / 拓扑</text><polyline points="320,180 397,180" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="675,180 752,180" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="893,230 893,342" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="755" y="345" width="275" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="773" y="379" font-size="24" fill="#25352f" text-anchor="start">生命周期控制器</text><text x="773" y="410" font-size="20" fill="#5c6d64" text-anchor="start">创建 / 加载 / 预热</text><rect x="400" y="345" width="275" height="100" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="418" y="379" font-size="24" fill="#25352f" text-anchor="start">验证可服务容量</text><text x="418" y="410" font-size="20" fill="#5c6d64" text-anchor="start">版本与请求链路就绪</text><rect x="45" y="345" width="275" height="100" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="63" y="379" font-size="24" fill="#25352f" text-anchor="start">路由接入新容量</text><text x="63" y="410" font-size="20" fill="#5c6d64" text-anchor="start">观察真实请求质量</text><polyline points="755,395 678,395" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="400,395 323,395" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="497" width="985" height="70" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="63" y="531" font-size="24" fill="#25352f" text-anchor="start">回收训练容量另走保存 → 释放门禁，不直接删除作业代替协议</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
