<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">“兼容 PyTorch”是一组分层契约</title><desc id="desc">入口一致之后，仍然需要逐层验证语义、执行与维护边界</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">“兼容 PyTorch”是一组分层契约</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">入口一致之后，仍然需要逐层验证语义、执行与维护边界</text><rect x="55" y="120" width="420" height="70" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="73" y="154" font-size="24" fill="#25352f" text-anchor="start">模型 / Python 程序</text><rect x="55" y="210" width="420" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="73" y="244" font-size="24" fill="#25352f" text-anchor="start">设备接口 / tensor 与 storage</text><rect x="55" y="300" width="420" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="73" y="334" font-size="24" fill="#25352f" text-anchor="start">算子 / 自动微分 / 图编译</text><rect x="55" y="390" width="420" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="73" y="424" font-size="24" fill="#25352f" text-anchor="start">分配器 / stream / event / kernel</text><rect x="55" y="480" width="420" height="70" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="73" y="514" font-size="24" fill="#25352f" text-anchor="start">通信库 / 驱动 / 硬件</text><polyline points="265,190 265,207" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="265,280 265,297" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="265,370 265,387" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="265,460 265,477" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="545" y="162" font-size="23" fill="#25352f" text-anchor="start">输入、形状、数据类型</text><text x="545" y="252" font-size="23" fill="#25352f" text-anchor="start">身份、视图、生命周期</text><text x="545" y="342" font-size="23" fill="#25352f" text-anchor="start">前向 / 反向 / graph break</text><text x="545" y="432" font-size="23" fill="#25352f" text-anchor="start">异步依赖、内存复用、前进性</text><text x="545" y="522" font-size="23" fill="#25352f" text-anchor="start">collective、拓扑、版本组合</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
