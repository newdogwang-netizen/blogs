<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">异步后训练有两条方向相反的流</title><desc id="desc">绿色：样本数据；蓝色：新权重。奖励执行位置依算法与框架变化</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#49439C"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D6B33"/></marker></defs><rect width="1080" height="630" fill="#F4F4F8"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#1E1C32" text-anchor="start">异步后训练有两条方向相反的流</text><text x="36" y="78" font-size="19" fill="#68677A" text-anchor="start">绿色：样本数据；蓝色：新权重。奖励执行位置依算法与框架变化</text><rect x="45" y="165" width="220" height="125" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="63" y="199" font-size="24" fill="#1E1C32" text-anchor="start">Rollouter</text><text x="63" y="230" font-size="20" fill="#68677A" text-anchor="start">使用行为策略 v</text><text x="63" y="257" font-size="20" fill="#68677A" text-anchor="start">样本 / log prob</text><rect x="307" y="165" width="220" height="125" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="325" y="199" font-size="24" fill="#1E1C32" text-anchor="start">奖励与轨迹处理</text><text x="325" y="230" font-size="20" fill="#68677A" text-anchor="start">reward / mask</text><text x="325" y="257" font-size="20" fill="#68677A" text-anchor="start">终止与截断信息</text><rect x="569" y="165" width="220" height="125" rx="12" fill="#F1F1FB" stroke="#9190A4" stroke-width="1.5"/><text x="587" y="199" font-size="24" fill="#1E1C32" text-anchor="start">MessageQueue</text><text x="587" y="230" font-size="20" fill="#68677A" text-anchor="start">暂存完整样本</text><text x="587" y="257" font-size="20" fill="#68677A" text-anchor="start">限制年龄与预算</text><rect x="831" y="165" width="210" height="125" rx="12" fill="#E4E4F7" stroke="#9190A4" stroke-width="1.5"/><text x="849" y="199" font-size="24" fill="#1E1C32" text-anchor="start">Learner</text><text x="849" y="230" font-size="20" fill="#68677A" text-anchor="start">消费样本</text><text x="849" y="257" font-size="20" fill="#68677A" text-anchor="start">更新策略</text><polyline points="265,227 304,227" fill="none" stroke="#4D6B33" stroke-width="2.5" marker-end="url(#data)"/><polyline points="527,227 566,227" fill="none" stroke="#4D6B33" stroke-width="2.5" marker-end="url(#data)"/><polyline points="789,227 828,227" fill="none" stroke="#4D6B33" stroke-width="2.5" marker-end="url(#data)"/><rect x="337" y="421" width="410" height="105" rx="12" fill="#E4E4F7" stroke="#9190A4" stroke-width="1.5"/><text x="355" y="455" font-size="24" fill="#1E1C32" text-anchor="start">ParameterSynchronizer</text><text x="355" y="486" font-size="20" fill="#68677A" text-anchor="start">权重更新、版本交接与正在生成的轨迹</text><polyline points="936,290 936,472 750,472" fill="none" stroke="#49439C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="958" y="372" font-size="19" fill="#68677A" text-anchor="start">新权重</text><polyline points="337,472 155,472 155,293" fill="none" stroke="#49439C" stroke-width="2.5" marker-end="url(#arrow)"/><text x="184" y="450" font-size="19" fill="#68677A" text-anchor="start">同步</text><text x="65" y="564" font-size="23" fill="#1E1C32" text-anchor="start">异步执行不等于样本无版本；数据流和权重流必须能关联。</text><text x="36" y="606" font-size="17" fill="#68677A" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
