<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">状态粒度，决定谁与谁竞争</title><desc id="desc">对应大会演进思路的抽象重绘，不是实际 CRD 字段图</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">状态粒度，决定谁与谁竞争</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">对应大会演进思路的抽象重绘，不是实际 CRD 字段图</text><rect x="35" y="125" width="320" height="410" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="53" y="154" font-size="20" fill="#5c6d64" text-anchor="start">A · 多写者 / 共享对象</text><rect x="380" y="125" width="320" height="410" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="398" y="154" font-size="20" fill="#5c6d64" text-anchor="start">B · 集中协调</text><rect x="725" y="125" width="320" height="410" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="743" y="154" font-size="20" fill="#5c6d64" text-anchor="start">C · 按拓扑分区</text><rect x="58" y="185" width="120" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="76" y="219" font-size="24" fill="#25352f" text-anchor="start">节点 A</text><rect x="208" y="185" width="120" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="226" y="219" font-size="24" fill="#25352f" text-anchor="start">节点 B</text><polyline points="118,255 118,320 190,320 190,352" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="268,255 268,320 190,320" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="67" y="355" width="250" height="100" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="85" y="389" font-size="24" fill="#25352f" text-anchor="start">共享状态 v7 → v8</text><text x="85" y="420" font-size="20" fill="#5c6d64" text-anchor="start">旧版本写入冲突</text><rect x="410" y="185" width="260" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="428" y="219" font-size="24" fill="#25352f" text-anchor="start">多个节点上报</text><polyline points="540,255 540,295" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="410" y="298" width="260" height="70" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="428" y="332" font-size="24" fill="#25352f" text-anchor="start">单一更新队列</text><polyline points="540,368 540,405" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="410" y="408" width="260" height="70" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="428" y="442" font-size="24" fill="#25352f" text-anchor="start">集中状态对象</text><rect x="751" y="185" width="266" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="769" y="219" font-size="24" fill="#25352f" text-anchor="start">拓扑域 A / 对象 A</text><text x="769" y="250" font-size="20" fill="#5c6d64" text-anchor="start">域内仍需并发控制</text><rect x="751" y="317" width="266" height="100" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="769" y="351" font-size="24" fill="#25352f" text-anchor="start">拓扑域 B / 对象 B</text><text x="769" y="382" font-size="20" fill="#5c6d64" text-anchor="start">避免域 A 的无关写竞争</text><text x="762" y="469" font-size="22" fill="#25352f" text-anchor="start">跨域任务仍需协调</text><text x="57" y="570" font-size="23" fill="#25352f" text-anchor="start">分片缩小竞争范围；不自动解决部分提交、过期读和资源泄漏。</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
