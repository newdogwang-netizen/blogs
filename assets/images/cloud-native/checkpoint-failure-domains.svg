<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">快 checkpoint 与持久 checkpoint，保障范围不同</title><desc id="desc">下图是设计比较；不表示所有框架默认串联这三层</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">快 checkpoint 与持久 checkpoint，保障范围不同</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">下图是设计比较；不表示所有框架默认串联这三层</text><rect x="45" y="120" width="275" height="360" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="63" y="154" font-size="24" fill="#25352f" text-anchor="start">对端内存</text><text x="63" y="185" font-size="20" fill="#5c6d64" text-anchor="start">传输路径可能很快</text><text x="63" y="212" font-size="20" fill="#5c6d64" text-anchor="start"></text><text x="63" y="239" font-size="20" fill="#5c6d64" text-anchor="start">需要对端继续存活</text><text x="63" y="266" font-size="20" fill="#5c6d64" text-anchor="start"></text><text x="63" y="293" font-size="20" fill="#5c6d64" text-anchor="start">副本应跨所需故障域</text><rect x="400" y="120" width="275" height="360" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="418" y="154" font-size="24" fill="#25352f" text-anchor="start">本地磁盘</text><text x="418" y="185" font-size="20" fill="#5c6d64" text-anchor="start">可跨进程生命周期</text><text x="418" y="212" font-size="20" fill="#5c6d64" text-anchor="start"></text><text x="418" y="239" font-size="20" fill="#5c6d64" text-anchor="start">整机丢失后可能不可达</text><text x="418" y="266" font-size="20" fill="#5c6d64" text-anchor="start"></text><text x="418" y="293" font-size="20" fill="#5c6d64" text-anchor="start">关注落盘与完整提交</text><rect x="755" y="120" width="275" height="360" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="773" y="154" font-size="24" fill="#25352f" text-anchor="start">持久共享存储</text><text x="773" y="185" font-size="20" fill="#5c6d64" text-anchor="start">与计算节点解耦</text><text x="773" y="212" font-size="20" fill="#5c6d64" text-anchor="start"></text><text x="773" y="239" font-size="20" fill="#5c6d64" text-anchor="start">有独立性能/故障边界</text><text x="773" y="266" font-size="20" fill="#5c6d64" text-anchor="start"></text><text x="773" y="293" font-size="20" fill="#5c6d64" text-anchor="start">适合保留更耐久恢复点</text><polyline points="320,300 397,300" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="329" y="285" font-size="19" fill="#5c6d64" text-anchor="start">可提升</text><polyline points="675,300 752,300" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="684" y="285" font-size="19" fill="#5c6d64" text-anchor="start">可提升</text><rect x="45" y="512" width="985" height="60" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="63" y="546" font-size="24" fill="#25352f" text-anchor="start">相关故障可能同时摧毁多个副本：数量必须与放置一起评估</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
