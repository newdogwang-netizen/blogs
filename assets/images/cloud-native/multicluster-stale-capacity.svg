<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">容量信息有年龄，分发成功不等于容量承诺</title><desc id="desc">作者的竞争窗口示意；更短的汇总周期无法彻底消除它</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">容量信息有年龄，分发成功不等于容量承诺</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">作者的竞争窗口示意；更短的汇总周期无法彻底消除它</text><text x="65" y="145" font-size="24" fill="#25352f" text-anchor="start">成员集群 A</text><text x="660" y="145" font-size="24" fill="#25352f" text-anchor="start">全局控制面</text><line x1="160" y1="165" x2="160" y2="533" stroke="#81978b" stroke-dasharray="5 5"/><line x1="790" y1="165" x2="790" y2="533" stroke="#81978b" stroke-dasharray="5 5"/><polyline points="160,215 790,215" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="337" y="196" font-size="19" fill="#5c6d64" text-anchor="start">t0 · 上报：空闲 16 张</text><rect x="55" y="265" width="370" height="80" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="73" y="299" font-size="24" fill="#25352f" text-anchor="start">t1 · 本地任务占用 8 张</text><text x="73" y="330" font-size="20" fill="#5c6d64" text-anchor="start">旧的上报不会立刻被撤回</text><polyline points="790,388 160,388" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="369" font-size="19" fill="#5c6d64" text-anchor="start">t2 · 仍按 16 张放置新任务</text><polyline points="160,477 790,477" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="458" font-size="19" fill="#5c6d64" text-anchor="start">t3 · 本地准入失败 / 反馈 / 重排</text><text x="65" y="568" font-size="22" fill="#25352f" text-anchor="start">可选集成：候选放置 → 本地限时预留 → 确认；部分成功须可撤销。</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
