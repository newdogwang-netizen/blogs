<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">任务与沙箱，不共用一个生命周期</title><desc id="desc">任务取消时先收回动作权限；保存文件不意味着保存有效授权</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">任务与沙箱，不共用一个生命周期</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">任务取消时先收回动作权限；保存文件不意味着保存有效授权</text><rect x="40" y="120" width="995" height="150" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="58" y="149" font-size="20" fill="#5c6d64" text-anchor="start">任务状态</text><rect x="65" y="170" width="190" height="65" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="83" y="204" font-size="24" fill="#25352f" text-anchor="start">已授权</text><rect x="320" y="170" width="190" height="65" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="338" y="204" font-size="24" fill="#25352f" text-anchor="start">执行中</text><rect x="575" y="170" width="190" height="65" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="593" y="204" font-size="24" fill="#25352f" text-anchor="start">完成 / 取消</text><rect x="830" y="170" width="180" height="65" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="848" y="204" font-size="24" fill="#25352f" text-anchor="start">授权撤销</text><polyline points="255,202 317,202" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="510,202 572,202" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="765,202 827,202" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="310" width="995" height="200" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="58" y="339" font-size="20" fill="#5c6d64" text-anchor="start">沙箱状态</text><rect x="65" y="365" width="165" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="83" y="399" font-size="24" fill="#25352f" text-anchor="start">干净预热</text><text x="83" y="430" font-size="20" fill="#5c6d64" text-anchor="start">未绑定身份</text><rect x="268" y="365" width="165" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="286" y="399" font-size="24" fill="#25352f" text-anchor="start">绑定任务</text><text x="286" y="430" font-size="20" fill="#5c6d64" text-anchor="start">加载授权</text><rect x="471" y="365" width="165" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="489" y="399" font-size="24" fill="#25352f" text-anchor="start">运行</text><text x="489" y="430" font-size="20" fill="#5c6d64" text-anchor="start">受限执行</text><rect x="674" y="365" width="165" height="95" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="692" y="399" font-size="24" fill="#25352f" text-anchor="start">保留 / 暂停</text><text x="692" y="430" font-size="20" fill="#5c6d64" text-anchor="start">状态另议</text><rect x="877" y="365" width="135" height="95" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="895" y="399" font-size="24" fill="#25352f" text-anchor="start">销毁</text><text x="895" y="430" font-size="20" fill="#5c6d64" text-anchor="start">完成清理</text><polyline points="230,413 265,413" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="433,413 468,413" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="636,413 671,413" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="839,413 874,413" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="62" y="558" font-size="23" fill="#25352f" text-anchor="start">独立决策：文件是否保留  /  进程是否恢复  /  新任务是否重新授权</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
