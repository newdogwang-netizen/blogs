<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">一次远端写，怎样成为可信的结果？</title><desc id="desc">讲师 LSA 最小示例的验证顺序 · 不是无主机参与的持久 kernel</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">一次远端写，怎样成为可信的结果？</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">讲师 LSA 最小示例的验证顺序 · 不是无主机参与的持久 kernel</text><rect x="50" y="130" width="295" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="68" y="164" font-size="24" fill="#25352f" text-anchor="start">窗口分配与注册</text><text x="68" y="195" font-size="20" fill="#5c6d64" text-anchor="start">各 rank 建立相同组织</text><rect x="395" y="130" width="295" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="413" y="164" font-size="24" fill="#25352f" text-anchor="start">GPU 远端写入</text><text x="413" y="195" font-size="20" fill="#5c6d64" text-anchor="start">写入带源/目的身份的签名</text><rect x="740" y="130" width="290" height="95" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="758" y="164" font-size="24" fill="#25352f" text-anchor="start">系统范围 fence</text><text x="758" y="195" font-size="20" fill="#5c6d64" text-anchor="start">参与内存顺序保证</text><polyline points="345,177 392,177" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="690,177 737,177" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="885,225 885,286 885,332" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="740" y="335" width="290" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="758" y="369" font-size="24" fill="#25352f" text-anchor="start">本地设备同步</text><text x="758" y="400" font-size="20" fill="#5c6d64" text-anchor="start">主机等待本地 kernel 完成</text><rect x="395" y="335" width="295" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="413" y="369" font-size="24" fill="#25352f" text-anchor="start">MPI barrier</text><text x="413" y="400" font-size="20" fill="#5c6d64" text-anchor="start">各 rank 都完成该阶段</text><rect x="50" y="335" width="295" height="95" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="68" y="369" font-size="24" fill="#25352f" text-anchor="start">读取并逐槽验证</text><text x="68" y="400" font-size="20" fill="#5c6d64" text-anchor="start">缺写、错 peer 均应失败</text><polyline points="740,382 693,382" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="395,382 348,382" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="480" width="980" height="80" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="68" y="514" font-size="24" fill="#25352f" text-anchor="start">fence ≠ 集合屏障；指针有效 ≠ 本轮数据已经到达</text><text x="68" y="545" font-size="20" fill="#5c6d64" text-anchor="start">MPI 协调进程阶段，不承载这个示例的 GPU payload</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
