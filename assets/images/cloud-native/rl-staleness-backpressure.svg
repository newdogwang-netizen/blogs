<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">队列保存的不只是样本，还有过去的策略</title><desc id="desc">Δv 是观察量；具体 staleness 参数未必直接等于版本差</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">队列保存的不只是样本，还有过去的策略</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">Δv 是观察量；具体 staleness 参数未必直接等于版本差</text><rect x="55" y="132" width="280" height="105" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="73" y="166" font-size="24" fill="#25352f" text-anchor="start">生成端：策略 v</text><text x="73" y="197" font-size="20" fill="#5c6d64" text-anchor="start">快样本先完成</text><text x="73" y="224" font-size="20" fill="#5c6d64" text-anchor="start">长轨迹可能跨同步</text><rect x="400" y="132" width="280" height="105" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="418" y="166" font-size="24" fill="#25352f" text-anchor="start">队列等待</text><text x="418" y="197" font-size="20" fill="#5c6d64" text-anchor="start">v、v、v+1 …</text><text x="418" y="224" font-size="20" fill="#5c6d64" text-anchor="start">样本年龄持续增加</text><rect x="745" y="132" width="280" height="105" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="763" y="166" font-size="24" fill="#25352f" text-anchor="start">训练端：策略 v+3</text><text x="763" y="197" font-size="20" fill="#5c6d64" text-anchor="start">继续更新</text><text x="763" y="224" font-size="20" fill="#5c6d64" text-anchor="start">消费旧样本</text><polyline points="335,185 397,185" fill="none" stroke="#197657" stroke-width="2.5" marker-end="url(#data)"/><polyline points="680,185 742,185" fill="none" stroke="#197657" stroke-width="2.5" marker-end="url(#data)"/><polyline points="885,237 885,309 192,309 192,240" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="325" y="295" font-size="19" fill="#5c6d64" text-anchor="start">背压：限制继续生产或调整资源配比</text><rect x="55" y="360" width="970" height="180" rx="14" fill="none" stroke="#81978b" stroke-dasharray="7 5"/><text x="73" y="389" font-size="20" fill="#5c6d64" text-anchor="start">观测与处理，不要只看队列长度</text><text x="80" y="418" font-size="24" fill="#25352f" text-anchor="start">观察：生成版本、消费版本、排队年龄、丢弃比例</text><text x="80" y="464" font-size="24" fill="#25352f" text-anchor="start">处理：按算法规则限制、校正或丢弃；不能无限积压</text><text x="80" y="507" font-size="22" fill="#25352f" text-anchor="start">最终指标：同一 GPU 预算下，达到目标质量的时间</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
