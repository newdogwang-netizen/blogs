<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">统一公共规则，保留专用生命周期</title><desc id="desc">训练、推理、Agent 共享资源层；请求和会话仍有各自的数据面</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">统一公共规则，保留专用生命周期</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">训练、推理、Agent 共享资源层；请求和会话仍有各自的数据面</text><rect x="45" y="126" width="290" height="128" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="63" y="160" font-size="24" fill="#25352f" text-anchor="start">训练控制器</text><text x="63" y="191" font-size="20" fill="#5c6d64" text-anchor="start">组启动 / checkpoint</text><text x="63" y="218" font-size="20" fill="#5c6d64" text-anchor="start">恢复与完成条件</text><rect x="395" y="126" width="290" height="128" rx="12" fill="#e5edf3" stroke="#81978b" stroke-width="1.5"/><text x="413" y="160" font-size="24" fill="#25352f" text-anchor="start">推理控制器</text><text x="413" y="191" font-size="20" fill="#5c6d64" text-anchor="start">Kthena 等：版本与容量</text><text x="413" y="218" font-size="20" fill="#5c6d64" text-anchor="start">router：请求级选择</text><rect x="745" y="126" width="290" height="128" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="763" y="160" font-size="24" fill="#25352f" text-anchor="start">Agent 运行时</text><text x="763" y="191" font-size="20" fill="#5c6d64" text-anchor="start">会话 / 身份 / 执行环境</text><text x="763" y="218" font-size="20" fill="#5c6d64" text-anchor="start">取消与清理</text><polyline points="190,254 190,328" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="540,254 540,328" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="890,254 890,328" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="331" width="990" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="63" y="365" font-size="24" fill="#25352f" text-anchor="start">公共资源治理：身份、配额、优先级、审计</text><text x="63" y="396" font-size="20" fill="#5c6d64" text-anchor="start">输入是合法需求；最终容量决策要有明确所有者</text><polyline points="540,426 540,463" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="466" width="990" height="80" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="63" y="500" font-size="24" fill="#25352f" text-anchor="start">调度 / 节点 / 设备准备</text><text x="63" y="531" font-size="20" fill="#5c6d64" text-anchor="start">Volcano 等组件处理实际资源与放置，不替上层定义业务成功</text><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
