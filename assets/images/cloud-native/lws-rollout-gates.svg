<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">更新中有四种不同的“好了”</title><desc id="desc">不能把发现、容量、请求语义压成同一个 Ready</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197657"/></marker></defs><rect width="1080" height="630" fill="#f7f4eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="28" fill="#25352f" text-anchor="start">更新中有四种不同的“好了”</text><text x="36" y="78" font-size="19" fill="#5c6d64" text-anchor="start">不能把发现、容量、请求语义压成同一个 Ready</text><rect x="50" y="117" width="270" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="68" y="151" font-size="24" fill="#25352f" text-anchor="start">1 · 对象已创建</text><text x="68" y="182" font-size="20" fill="#5c6d64" text-anchor="start">新 P / D 的 LWS 存在</text><rect x="395" y="117" width="635" height="95" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="413" y="151" font-size="24" fill="#25352f" text-anchor="start">对象层</text><text x="413" y="182" font-size="20" fill="#5c6d64" text-anchor="start">控制器已有可协调的目标，不等于模型已加载</text><polyline points="320,166 392,166" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="237" width="270" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="68" y="271" font-size="24" fill="#25352f" text-anchor="start">2 · 版本可发现</text><text x="68" y="302" font-size="20" fill="#5c6d64" text-anchor="start">各角色 ≥ 1 个组 Ready</text><rect x="395" y="237" width="635" height="95" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="413" y="271" font-size="24" fill="#25352f" text-anchor="start">服务发现门禁</text><text x="413" y="302" font-size="20" fill="#5c6d64" text-anchor="start">revisionReadyOnAllRoles；不是完整目标容量</text><polyline points="320,285 392,285" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="357" width="270" height="95" rx="12" fill="#e5efe8" stroke="#81978b" stroke-width="1.5"/><text x="68" y="391" font-size="24" fill="#25352f" text-anchor="start">3 · 当前容量稳定</text><text x="68" y="422" font-size="20" fill="#5c6d64" text-anchor="start">各角色达到当前期望</text><rect x="395" y="357" width="635" height="95" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="413" y="391" font-size="24" fill="#25352f" text-anchor="start">更新执行门禁</text><text x="413" y="422" font-size="20" fill="#5c6d64" text-anchor="start">executor 再推进下一步；受更新预算约束</text><polyline points="320,404 392,404" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="477" width="270" height="95" rx="12" fill="#faead7" stroke="#81978b" stroke-width="1.5"/><text x="68" y="511" font-size="24" fill="#25352f" text-anchor="start">4 · 请求安全切换</text><text x="68" y="542" font-size="20" fill="#5c6d64" text-anchor="start">排空 / KV 兼容 / 路由</text><rect x="395" y="477" width="635" height="95" rx="12" fill="#fffdf7" stroke="#81978b" stroke-width="1.5"/><text x="413" y="511" font-size="24" fill="#25352f" text-anchor="start">数据面责任</text><text x="413" y="542" font-size="20" fill="#5c6d64" text-anchor="start">需要另行实现与验证，不由副本数量自动保证</text><polyline points="320,524 392,524" fill="none" stroke="#526e83" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="606" font-size="17" fill="#5c6d64" text-anchor="start">2026 上海大会技术研究笔记 · 原创机制示意，非实测结果</text></g></svg>
