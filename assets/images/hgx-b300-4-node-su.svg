<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">HGX B300 四节点 Scalable Unit 拓扑</title>
  <desc id="desc">四台HGX B300服务器分别通过八个ConnectX-8连接双计算平面，通过BlueField-3连接南北向网络，并通过六个一千兆管理端口连接带外网络。</desc>
  <defs>
    <style>
      .bg{fill:#f7f4eb}.panel{fill:#fff;stroke:#242820;stroke-width:2}.node{fill:#fdfbf5;stroke:#8b8f83;stroke-width:2}.gpu{fill:#eaf4ef;stroke:#176b58;stroke-width:1.5}.net{fill:#fff0e9;stroke:#dc5428;stroke-width:2}.mgmt{fill:#eef1f7;stroke:#4e668f;stroke-width:2}.t{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#171914}.h1{font-size:34px;font-weight:700}.h2{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#5d6258}.a{stroke:#dc5428;stroke-width:4;fill:none}.b{stroke:#176b58;stroke-width:4;fill:none}.m{stroke:#4e668f;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
    </style>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dc5428"/></marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176b58"/></marker>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4e668f"/></marker>
  </defs>
  <rect class="bg" width="1400" height="820" rx="20"/>
  <text class="t h1" x="60" y="58">官方积木：4-node HGX B300 Scalable Unit</text>
  <text class="t small" x="60" y="88">32 GPU · 32 ConnectX-8 · 64×400G Compute · 8×400G N/S · 24×1G OOB</text>

  <rect class="net" x="120" y="120" width="550" height="82" rx="12"/>
  <text class="t h2" x="395" y="153" text-anchor="middle">Compute Plane A</text>
  <text class="t body" x="395" y="181" text-anchor="middle">每节点 8×400G，共32×400G</text>
  <rect class="gpu" x="730" y="120" width="550" height="82" rx="12"/>
  <text class="t h2" x="1005" y="153" text-anchor="middle">Compute Plane B</text>
  <text class="t body" x="1005" y="181" text-anchor="middle">每节点 8×400G，共32×400G</text>

  <g>
    <rect class="node" x="60" y="285" width="295" height="270" rx="14"/>
    <text class="t h2" x="207" y="322" text-anchor="middle">HGX Node 01</text>
    <rect class="gpu" x="88" y="345" width="239" height="55" rx="7"/><text class="t body" x="207" y="379" text-anchor="middle">8×B300 + 2×NVSwitch</text>
    <rect class="net" x="88" y="416" width="239" height="55" rx="7"/><text class="t body" x="207" y="450" text-anchor="middle">8×CX-8（2×400G）</text>
    <rect class="mgmt" x="88" y="487" width="112" height="42" rx="7"/><text class="t small" x="144" y="513" text-anchor="middle">BF3 2×400G</text>
    <rect class="mgmt" x="215" y="487" width="112" height="42" rx="7"/><text class="t small" x="271" y="513" text-anchor="middle">6×1G OOB</text>
  </g>
  <g transform="translate(330 0)">
    <rect class="node" x="60" y="285" width="295" height="270" rx="14"/>
    <text class="t h2" x="207" y="322" text-anchor="middle">HGX Node 02</text>
    <rect class="gpu" x="88" y="345" width="239" height="55" rx="7"/><text class="t body" x="207" y="379" text-anchor="middle">8×B300 + 2×NVSwitch</text>
    <rect class="net" x="88" y="416" width="239" height="55" rx="7"/><text class="t body" x="207" y="450" text-anchor="middle">8×CX-8（2×400G）</text>
    <rect class="mgmt" x="88" y="487" width="112" height="42" rx="7"/><text class="t small" x="144" y="513" text-anchor="middle">BF3 2×400G</text>
    <rect class="mgmt" x="215" y="487" width="112" height="42" rx="7"/><text class="t small" x="271" y="513" text-anchor="middle">6×1G OOB</text>
  </g>
  <g transform="translate(660 0)">
    <rect class="node" x="60" y="285" width="295" height="270" rx="14"/>
    <text class="t h2" x="207" y="322" text-anchor="middle">HGX Node 03</text>
    <rect class="gpu" x="88" y="345" width="239" height="55" rx="7"/><text class="t body" x="207" y="379" text-anchor="middle">8×B300 + 2×NVSwitch</text>
    <rect class="net" x="88" y="416" width="239" height="55" rx="7"/><text class="t body" x="207" y="450" text-anchor="middle">8×CX-8（2×400G）</text>
    <rect class="mgmt" x="88" y="487" width="112" height="42" rx="7"/><text class="t small" x="144" y="513" text-anchor="middle">BF3 2×400G</text>
    <rect class="mgmt" x="215" y="487" width="112" height="42" rx="7"/><text class="t small" x="271" y="513" text-anchor="middle">6×1G OOB</text>
  </g>
  <g transform="translate(990 0)">
    <rect class="node" x="60" y="285" width="295" height="270" rx="14"/>
    <text class="t h2" x="207" y="322" text-anchor="middle">HGX Node 04</text>
    <rect class="gpu" x="88" y="345" width="239" height="55" rx="7"/><text class="t body" x="207" y="379" text-anchor="middle">8×B300 + 2×NVSwitch</text>
    <rect class="net" x="88" y="416" width="239" height="55" rx="7"/><text class="t body" x="207" y="450" text-anchor="middle">8×CX-8（2×400G）</text>
    <rect class="mgmt" x="88" y="487" width="112" height="42" rx="7"/><text class="t small" x="144" y="513" text-anchor="middle">BF3 2×400G</text>
    <rect class="mgmt" x="215" y="487" width="112" height="42" rx="7"/><text class="t small" x="271" y="513" text-anchor="middle">6×1G OOB</text>
  </g>

  <path class="a" d="M193 416V238M523 416V238M853 416V238M1183 416V238M193 238H1183"/>
  <path class="a" marker-end="url(#arrowA)" d="M395 238V205"/>
  <path class="b" d="M221 416V258M551 416V258M881 416V258M1211 416V258M221 258H1211"/>
  <path class="b" marker-end="url(#arrowB)" d="M1005 258V205"/>

  <rect class="mgmt" x="105" y="650" width="550" height="88" rx="12"/>
  <text class="t h2" x="380" y="685" text-anchor="middle">Converged North/South Fabric</text>
  <text class="t body" x="380" y="716" text-anchor="middle">4×BlueField-3 → 8×400G</text>
  <rect class="mgmt" x="745" y="650" width="550" height="88" rx="12"/>
  <text class="t h2" x="1020" y="685" text-anchor="middle">Out-of-Band Management</text>
  <text class="t body" x="1020" y="716" text-anchor="middle">BMC / DPU / SuperNIC → 24×1G</text>
  <path class="m" marker-end="url(#arrowM)" d="M537 529V610H380V646"/>
  <path class="m" marker-end="url(#arrowM)" d="M1197 529V610H1020V646"/>
  <text class="t small" x="700" y="790" text-anchor="middle">橙色/绿色：两个物理独立的GPU计算平面　蓝色：存储、用户与管理网络</text>
</svg>
